<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Votre parcours · Acme</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <header class="masthead"><a href="/" aria-label="Accueil du parcours">parcours<span aria-hidden="true">.</span></a><span>Acme</span></header>
  <main>
    <p class="eyebrow">VOTRE ACCOMPAGNEMENT</p>
    <h1>Une étape à la fois.</h1>
    <p class="intro">Retrouvez les étapes de votre projet et ce qui vous attend ensuite.</p>
    <div class="progress-label"><h2>Votre parcours</h2><span id="progress-label"></span></div>
    <progress id="progress" max="5" value="1" aria-label="Progression du parcours"></progress>
    <ol id="steps" aria-label="Étapes du parcours"></ol>
    <div class="next-action">
      <p id="next" aria-live="polite"></p>
      <button id="complete" type="button">Valider cette étape <span aria-hidden="true">→</span></button>
    </div>
    <p id="storage-message" class="storage-message" role="status" hidden></p>
  </main>
  <footer><span>Parcours de démonstration · données fictives</span><button id="restart" type="button">Recommencer</button></footer>
</body>
</html>
