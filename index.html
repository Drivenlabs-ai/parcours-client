<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vos retours · Acme</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/app.js"></script>
</head>
<body>
  <header class="masthead"><a href="/" aria-label="Accueil des retours">feedback<span aria-hidden="true">.</span></a><span>Acme</span></header>
  <main>
    <p class="eyebrow">VOS IDÉES FONT LA SUITE</p>
    <h1>Qu’en pensez-vous ?</h1>
    <p class="intro">Une idée, un problème, une amélioration ? Partagez votre retour.</p>
    <form id="feedback-form">
      <label for="feedback-text">Votre retour</label>
      <textarea id="feedback-text" name="feedback" rows="3" maxlength="500" required placeholder="J’aimerais pouvoir…"></textarea>
      <div class="form-actions"><p id="notice" role="status"></p><button type="submit">Envoyer le retour <span aria-hidden="true">→</span></button></div>
    </form>
    <div class="list-heading"><h2>Les retours</h2><span id="count"></span></div>
    <ul id="feedbacks" aria-label="Retours clients"></ul>
    <p id="storage-message" class="storage-message" role="status" hidden></p>
  </main>
  <footer><span>Démonstration locale · données fictives</span><button id="restart" type="button">Réinitialiser la démo</button></footer>
</body>
</html>
